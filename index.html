<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>画像操作アプリ</title>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #e0e0e0;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none; user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: contain; background-position: center;
            background-repeat: no-repeat; z-index: 0; pointer-events: none;
        }
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }

        /* 共通 wrapper */
        .item-wrapper {
            position: absolute; top: 0; left: 0;
            transform-origin: center center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-radius: 8px;
            touch-action: none;
        }
        .item-wrapper img.item-img {
            display: block;
            border-radius: 8px;
            pointer-events: none;
            -webkit-user-drag: none;
            width: 100%;
            height: 100%;
        }

        .selection-border {
            display: none;
            position: absolute; inset: -10px;
            border: 2px dashed rgba(0,122,255,0.8);
            border-radius: 10px;
            pointer-events: none;
        }
        .item-wrapper.selected .selection-border { display: block; }
        .item-wrapper.selected .rotate-handle   { display: flex; }

        .rotate-handle {
            display: none;
            position: absolute;
            width: 28px; height: 28px;
            background: #007aff;
            border: 2px solid #fff;
            border-radius: 50%;
            justify-content: center; align-items: center;
            font-size: 14px; color: #fff;
            cursor: crosshair;
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
            user-select: none;
            z-index: 20;
            touch-action: none;
        }
        .rotate-handle.tl { top: -16px;    left: -16px; }
        .rotate-handle.tr { top: -16px;    right: -16px; }
        .rotate-handle.bl { bottom: -16px; left: -16px; }
        .rotate-handle.br { bottom: -16px; right: -16px; }

        .nav-btn {
            position: absolute; bottom: 20px; font-size: 40px;
            color: rgba(0,0,0,0.4); background: transparent;
            width: 50px; height: 50px; display: flex;
            justify-content: center; align-items: center;
            z-index: 9999; cursor: pointer; touch-action: manipulation;
        }
        .nav-btn:active { color: rgba(0,0,0,0.8); }
        .nav-btn.left { left: 20px; }
        .nav-btn.right { right: 20px; }
        .nav-btn.disabled { opacity: 0.1; pointer-events: none; }

        .settings-btn {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            font-size: 40px; color: #000; opacity: 0.15;
            z-index: 9999; cursor: pointer; touch-action: manipulation;
        }
        .settings-btn:active { opacity: 0.4; }

        #settings-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 10000;
            justify-content: center; align-items: center; backdrop-filter: blur(2px);
        }
        .modal-content {
            background: rgba(255,255,255,0.95); padding: 30px; border-radius: 20px;
            display: flex; flex-direction: column; gap: 20px; min-width: 280px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-content button {
            padding: 16px; font-size: 18px; font-weight: bold; color: #fff;
            background-color: #007aff; border: none; border-radius: 12px; cursor: pointer;
        }
        .modal-content button:active { background-color: #005bb5; }
        .modal-content button.close-btn { background-color: #8e8e93; }
        .modal-content button.close-btn:active { background-color: #636366; }

        .hidden-input { display: none; }
    </style>
</head>
<body>
    <div id="btn-prev" class="nav-btn left disabled">◁</div>
    <div id="btn-settings" class="settings-btn">⚙</div>
    <div id="btn-next" class="nav-btn right disabled">▷</div>

    <div id="settings-modal">
        <div class="modal-content">
            <button id="btn-bg">背景を変更</button>
            <button id="btn-add">画像を追加</button>
            <button id="btn-add-page">新しいページを追加</button>
            <button id="btn-close-modal" class="close-btn">閉じる</button>
        </div>
    </div>

    <input type="file" id="input-bg"  class="hidden-input" accept="image/*">
    <input type="file" id="input-add" class="hidden-input" accept="image/*" multiple>
    <div id="background"></div>
    <div id="canvas-container"></div>

<script>
// =====================================================
// デバイス判定
// =====================================================
var IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

// =====================================================
// 状態
// =====================================================
var appState = {
    pages: [{ id: 'page-1', background: null, items: [] }],
    currentPageIndex: 0
};
var zIndexCounter = 10;
var placementOffset = 0;

// =====================================================
// UI イベント（モーダル・ページ切り替え）
// =====================================================
var modal = document.getElementById('settings-modal');
document.getElementById('btn-settings').addEventListener('click', function() {
    modal.style.display = 'flex';
});
document.getElementById('btn-close-modal').addEventListener('click', function() {
    modal.style.display = 'none';
});
document.getElementById('btn-bg').addEventListener('click', function() {
    document.getElementById('input-bg').click();
    modal.style.display = 'none';
});
document.getElementById('btn-add').addEventListener('click', function() {
    document.getElementById('input-add').click();
    modal.style.display = 'none';
});
document.getElementById('btn-add-page').addEventListener('click', function() {
    appState.pages.push({ id: 'page-' + (appState.pages.length + 1), background: null, items: [] });
    appState.currentPageIndex = appState.pages.length - 1;
    renderPage();
    modal.style.display = 'none';
});
document.getElementById('btn-prev').addEventListener('click', function() {
    if (appState.currentPageIndex > 0) { appState.currentPageIndex--; renderPage(); }
});
document.getElementById('btn-next').addEventListener('click', function() {
    if (appState.currentPageIndex < appState.pages.length - 1) { appState.currentPageIndex++; renderPage(); }
});

// 背景クリックで選択解除（PC）
document.getElementById('canvas-container').addEventListener('pointerdown', function(e) {
    if (IS_TOUCH) return;
    if (e.target === document.getElementById('canvas-container')) deselectAll();
});

// =====================================================
// 画像読み込み
// =====================================================
document.getElementById('input-bg').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
        var url = ev.target.result;
        document.getElementById('background').style.backgroundImage = "url('" + url + "')";
        appState.pages[appState.currentPageIndex].background = url;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
});

document.getElementById('input-add').addEventListener('change', function(e) {
    var files = Array.from(e.target.files);
    files.forEach(function(file) {
        var myOffset = placementOffset;
        placementOffset += 30;
        if (placementOffset > 100) placementOffset = -50;

        var reader = new FileReader();
        reader.onload = function(ev) {
            createItemFromSrc(ev.target.result, myOffset);
        };
        reader.readAsDataURL(file);
    });
    e.target.value = '';
});

// =====================================================
// アイテム作成
// 戦略: 先に Image オブジェクトでサイズ取得 → DOM構築 → interactバインド
// =====================================================
function createItemFromSrc(src, offset) {
    var probe = new Image();
    probe.onload = function() {
        var nw = probe.naturalWidth;
        var nh = probe.naturalHeight;
        if (!nw || !nh) return;

        // 配置計算
        var maxW = window.innerWidth  * 0.4;
        var maxH = window.innerHeight * 0.4;
        var scale = 1;
        if (nw > maxW || nh > maxH) scale = Math.min(maxW / nw, maxH / nh);
        var dispW = nw * scale;
        var dispH = nh * scale;
        var x = (window.innerWidth  - dispW) / 2 + offset;
        var y = (window.innerHeight - dispH) / 2 + offset;

        // 状態作成
        var id = 'item_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        zIndexCounter++;
        var itemData = {
            id: id, src: src,
            x: x, y: y,
            scale: scale, angle: 0,
            zIndex: zIndexCounter,
            naturalWidth: nw, naturalHeight: nh
        };
        appState.pages[appState.currentPageIndex].items.push(itemData);

        // DOM 構築
        var wrapper = buildWrapperDOM(itemData);
        document.getElementById('canvas-container').appendChild(wrapper);

        // interact.js バインド
        bindInteractToWrapper(wrapper);

        // 追加直後はPCでは選択状態に
        if (!IS_TOUCH) selectWrapper(wrapper);
    };
    probe.onerror = function() { console.warn('image load error'); };
    probe.src = src;
}

// =====================================================
// ページ再描画
// =====================================================
function renderPage() {
    var page = appState.pages[appState.currentPageIndex];
    document.getElementById('background').style.backgroundImage =
        page.background ? "url('" + page.background + "')" : 'none';
    document.getElementById('canvas-container').innerHTML = '';

    page.items.forEach(function(d) {
        var wrapper = buildWrapperDOM(d);
        document.getElementById('canvas-container').appendChild(wrapper);
        bindInteractToWrapper(wrapper);
    });

    document.getElementById('btn-prev').classList.toggle('disabled', appState.currentPageIndex === 0);
    document.getElementById('btn-next').classList.toggle('disabled', appState.currentPageIndex >= appState.pages.length - 1);
}

// =====================================================
// DOM 構築
// =====================================================
function buildWrapperDOM(d) {
    var wrapper = document.createElement('div');
    wrapper.className = 'item-wrapper';
    wrapper.id = 'wrapper_' + d.id;
    wrapper.style.zIndex = d.zIndex;
    // wrapper のサイズは画像実寸に固定
    wrapper.style.width  = d.naturalWidth  + 'px';
    wrapper.style.height = d.naturalHeight + 'px';
    wrapper.dataset.itemId = d.id;
    wrapper.dataset.x = d.x;
    wrapper.dataset.y = d.y;
    wrapper.dataset.scale = d.scale;
    wrapper.dataset.angle = d.angle;

    // PCのみハンドル（先に追加）
    if (!IS_TOUCH) {
        ['tl','tr','bl','br'].forEach(function(c) {
            var h = document.createElement('div');
            h.className = 'rotate-handle ' + c;
            h.textContent = '↻';
            wrapper.appendChild(h);
        });
        var border = document.createElement('div');
        border.className = 'selection-border';
        wrapper.appendChild(border);
    }

    var img = document.createElement('img');
    img.className = 'item-img';
    img.src = d.src;
    wrapper.appendChild(img);

    applyTransform(wrapper);
    return wrapper;
}

// =====================================================
// interact.js バインド
// =====================================================
function bindInteractToWrapper(wrapper) {
    if (IS_TOUCH) {
        bindTouchInteract(wrapper);
    } else {
        bindPCInteract(wrapper);
    }
}

function bindTouchInteract(wrapper) {
    interact(wrapper)
        .draggable({
            inertia: false,
            listeners: {
                start: function(ev) { bringToFront(ev.target); },
                move: function(ev) {
                    var t = ev.target;
                    var x = (parseFloat(t.dataset.x) || 0) + ev.dx;
                    var y = (parseFloat(t.dataset.y) || 0) + ev.dy;
                    t.dataset.x = x;
                    t.dataset.y = y;
                    applyTransform(t);
                    updateState(t.dataset.itemId, { x: x, y: y });
                }
            }
        })
        .gesturable({
            listeners: {
                start: function(ev) {
                    bringToFront(ev.target);
                    ev.target.dataset.startScale = ev.target.dataset.scale || 1;
                },
                move: function(ev) {
                    var t = ev.target;
                    var angle = (parseFloat(t.dataset.angle) || 0) + ev.da;
                    var scale = (parseFloat(t.dataset.startScale) || 1) * ev.scale;
                    scale = Math.max(0.1, Math.min(scale, 5.0));
                    t.dataset.angle = angle;
                    t.dataset.scale = scale;
                    applyTransform(t);
                    updateState(t.dataset.itemId, { angle: angle, scale: scale });
                }
            }
        })
        .on('down', function(ev) { bringToFront(ev.currentTarget); });
}

function bindPCInteract(wrapper) {
    // ドラッグ
    interact(wrapper).draggable({
        ignoreFrom: '.rotate-handle',
        listeners: {
            start: function(ev) { selectWrapper(ev.target); },
            move: function(ev) {
                var t = ev.target;
                var x = (parseFloat(t.dataset.x) || 0) + ev.dx;
                var y = (parseFloat(t.dataset.y) || 0) + ev.dy;
                t.dataset.x = x;
                t.dataset.y = y;
                applyTransform(t);
                updateState(t.dataset.itemId, { x: x, y: y });
            }
        }
    });

    // 4つのハンドルそれぞれに回転バインド
    var handles = wrapper.querySelectorAll('.rotate-handle');
    for (var i = 0; i < handles.length; i++) {
        attachRotateHandle(handles[i], wrapper);
    }
}

// =====================================================
// PC 回転ハンドル
// =====================================================
function attachRotateHandle(handle, wrapper) {
    handle.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();

        var startAngle = parseFloat(wrapper.dataset.angle) || 0;
        var center = getWrapperCenter(wrapper);
        var startMouseAngle = Math.atan2(e.clientY - center.y, e.clientX - center.x) * 180 / Math.PI;

        try { handle.setPointerCapture(e.pointerId); } catch (_) {}

        function onMove(ev) {
            var c = getWrapperCenter(wrapper);
            var cur = Math.atan2(ev.clientY - c.y, ev.clientX - c.x) * 180 / Math.PI;
            var newAngle = startAngle + (cur - startMouseAngle);
            wrapper.dataset.angle = newAngle;
            applyTransform(wrapper);
            updateState(wrapper.dataset.itemId, { angle: newAngle });
        }
        function onUp(ev) {
            handle.removeEventListener('pointermove', onMove);
            handle.removeEventListener('pointerup', onUp);
            handle.removeEventListener('pointercancel', onUp);
            try { handle.releasePointerCapture(ev.pointerId); } catch (_) {}
        }
        handle.addEventListener('pointermove', onMove);
        handle.addEventListener('pointerup', onUp);
        handle.addEventListener('pointercancel', onUp);
    });
}

function getWrapperCenter(wrapper) {
    var x  = parseFloat(wrapper.dataset.x)  || 0;
    var y  = parseFloat(wrapper.dataset.y)  || 0;
    var sc = parseFloat(wrapper.dataset.scale) || 1;
    var w  = parseFloat(wrapper.style.width)  || wrapper.offsetWidth  || 0;
    var h  = parseFloat(wrapper.style.height) || wrapper.offsetHeight || 0;
    return {
        x: x + (w * sc) / 2,
        y: y + (h * sc) / 2
    };
}

// =====================================================
// PC ホイール拡大縮小
// =====================================================
document.getElementById('canvas-container').addEventListener('wheel', function(e) {
    if (IS_TOUCH) return;
    var wrapper = e.target.closest('.item-wrapper');
    if (!wrapper) return;
    e.preventDefault();
    var cur = parseFloat(wrapper.dataset.scale) || 1;
    var factor = e.deltaY < 0 ? 1.05 : 0.95;
    var next = Math.max(0.1, Math.min(cur * factor, 5.0));
    wrapper.dataset.scale = next;
    applyTransform(wrapper);
    updateState(wrapper.dataset.itemId, { scale: next });
}, { passive: false });

// =====================================================
// PC 選択管理
// =====================================================
function selectWrapper(wrapper) {
    if (IS_TOUCH) return;
    deselectAll();
    wrapper.classList.add('selected');
    bringToFront(wrapper);
}
function deselectAll() {
    var sel = document.querySelectorAll('.item-wrapper.selected');
    for (var i = 0; i < sel.length; i++) sel[i].classList.remove('selected');
}

// =====================================================
// ユーティリティ
// =====================================================
function applyTransform(el) {
    var x  = el.dataset.x  || 0;
    var y  = el.dataset.y  || 0;
    var sc = el.dataset.scale || 1;
    var an = el.dataset.angle || 0;
    el.style.transform = 'translate(' + x + 'px, ' + y + 'px) rotate(' + an + 'deg) scale(' + sc + ')';
}

function bringToFront(el) {
    var z = parseInt(el.style.zIndex, 10) || 0;
    if (z < zIndexCounter) {
        zIndexCounter++;
        el.style.zIndex = zIndexCounter;
        updateState(el.dataset.itemId, { zIndex: zIndexCounter });
    }
}

function updateState(id, updates) {
    var items = appState.pages[appState.currentPageIndex].items;
    for (var i = 0; i < items.length; i++) {
        if (items[i].id === id) {
            for (var k in updates) items[i][k] = updates[k];
            return;
        }
    }
}
</script>
</body>
</html>
