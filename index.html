<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- iPadでの勝手なズームやスクロールを完全に防ぐためのメタタグ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- iPadのフルスクリーン（PWA）対応 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>画像操作アプリ</title>
    <!-- interact.jsのCDN読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <style>
        /* デフォルトのブラウザ挙動をリセットし、タッチ操作を無効化 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e0e0e0;
            /* スワイプ戻るやダブルタップズームを防止 */
            touch-action: none; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 背景画像エリア */
        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain; /* 画像を見切れずに画面にちょうど収める */
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            pointer-events: none; /* 背景はタッチ判定させない */
        }

        /* キャンバスエリア（操作する画像を配置） */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 操作する画像（アイテム）のスタイル */
        .canvas-item {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: center center;
            /* 影をつけて重なりを見やすくする */
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-radius: 8px; /* 角を少し丸く */
        }

        /* 画面下部のナビゲーション・設定ボタン */
        .nav-btn {
            position: absolute;
            bottom: 20px;
            font-size: 40px;
            color: rgba(0, 0, 0, 0.4); /* シンプルな色合いに */
            background: transparent; /* 背景の丸を透明に */
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
        }
        .nav-btn:active { color: rgba(0, 0, 0, 0.8); }
        .nav-btn.left { left: 20px; }
        .nav-btn.right { right: 20px; }
        .nav-btn.disabled { opacity: 0.1; pointer-events: none; }

        .settings-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            color: #000;
            opacity: 0.15; /* 確実に薄く表示させる */
            z-index: 9999;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
        }
        .settings-btn:active { opacity: 0.4; }

        /* 設定モーダル */
        #settings-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 280px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-content button {
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #007aff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .modal-content button:active { background-color: #005bb5; }
        .modal-content button#btn-add-page { background-color: #34c759; } /* ページ追加ボタンは緑色に */
        .modal-content button#btn-add-page:active { background-color: #248a3d; }
        .modal-content button.close-btn { background-color: #8e8e93; }
        .modal-content button.close-btn:active { background-color: #636366; }

        /* ファイル入力（非表示） */
        .hidden-input {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 画面下部コントロール -->
    <div id="btn-prev" class="nav-btn left disabled">◁</div>
    <div id="btn-settings" class="settings-btn">⚙</div>
    <div id="btn-next" class="nav-btn right disabled">▷</div>

    <!-- 設定モーダル -->
    <div id="settings-modal">
        <div class="modal-content">
            <button id="btn-bg">背景を変更</button>
            <button id="btn-add">画像を追加</button>
            <button id="btn-add-page">新しいページを追加</button>
            <button id="btn-close-modal" class="close-btn">閉じる</button>
        </div>
    </div>

    <!-- 非表示のファイルアップロードinput -->
    <input type="file" id="input-bg" class="hidden-input" accept="image/*">
    <input type="file" id="input-add" class="hidden-input" accept="image/*" multiple>

    <!-- 背景表示エリア -->
    <div id="background"></div>

    <!-- 画像配置エリア -->
    <div id="canvas-container"></div>

    <script>
        // ==========================================
        // 状態管理（複数ページ対応）
        // ==========================================
        const appState = {
            pages: [
                {
                    id: 'page-1',
                    background: null,
                    items: [] // 画像データ：{ id, src, x, y, scale, angle, zIndex }
                }
            ],
            currentPageIndex: 0 // 現在のページ
        };

        let zIndexCounter = 10; // 最前面への移動用カウンター
        let placementOffset = 0; // 複数追加時に画像をずらすための数値

        // ==========================================
        // UIイベントのバインド (モーダルとページ切り替え)
        // ==========================================
        const modal = document.getElementById('settings-modal');
        
        document.getElementById('btn-settings').addEventListener('click', () => {
            modal.style.display = 'flex';
        });
        document.getElementById('btn-close-modal').addEventListener('click', () => {
            modal.style.display = 'none';
        });

        document.getElementById('btn-bg').addEventListener('click', () => {
            document.getElementById('input-bg').click();
            modal.style.display = 'none'; // 選択ダイアログを開いたらモーダルは閉じる
        });

        document.getElementById('btn-add').addEventListener('click', () => {
            document.getElementById('input-add').click();
            modal.style.display = 'none';
        });

        // 新しいページを追加
        document.getElementById('btn-add-page').addEventListener('click', () => {
            appState.pages.push({
                id: 'page-' + (appState.pages.length + 1),
                background: null,
                items: []
            });
            // 追加した新しいページにすぐ移動する
            appState.currentPageIndex = appState.pages.length - 1;
            renderPage();
            modal.style.display = 'none';
        });

        // ページ移動イベント
        document.getElementById('btn-prev').addEventListener('click', () => {
            if (appState.currentPageIndex > 0) {
                appState.currentPageIndex--;
                renderPage();
            }
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            if (appState.currentPageIndex < appState.pages.length - 1) {
                appState.currentPageIndex++;
                renderPage();
            }
        });

        // ==========================================
        // 描画ロジック（ページ切り替え対応）
        // ==========================================
        function renderPage() {
            const page = appState.pages[appState.currentPageIndex];
            
            // 背景の更新
            if (page.background) {
                document.getElementById('background').style.backgroundImage = `url('${page.background}')`;
            } else {
                document.getElementById('background').style.backgroundImage = 'none';
            }

            // キャンバスのクリア（前ページの画像を消す）
            const container = document.getElementById('canvas-container');
            container.innerHTML = '';

            // 現在のページのアイテムを再配置
            page.items.forEach(itemData => {
                renderItem(itemData);
            });

            // ◁ ▷ のボタンを押せる・押せない（透明度）の制御
            if (appState.currentPageIndex === 0) {
                document.getElementById('btn-prev').classList.add('disabled');
            } else {
                document.getElementById('btn-prev').classList.remove('disabled');
            }

            if (appState.currentPageIndex >= appState.pages.length - 1) {
                document.getElementById('btn-next').classList.add('disabled');
            } else {
                document.getElementById('btn-next').classList.remove('disabled');
            }
        }

        // 単一のアイテムをDOMに生成して配置する関数
        function renderItem(itemData) {
            const imgEl = document.createElement('img');
            imgEl.src = itemData.src;
            imgEl.className = 'canvas-item';
            imgEl.id = itemData.id;
            imgEl.style.zIndex = itemData.zIndex;
            
            imgEl.setAttribute('data-x', itemData.x);
            imgEl.setAttribute('data-y', itemData.y);
            imgEl.setAttribute('data-scale', itemData.scale);
            imgEl.setAttribute('data-angle', itemData.angle);
            
            updateTransform(imgEl);
            document.getElementById('canvas-container').appendChild(imgEl);
        }

        // ==========================================
        // 画像読み込み処理
        // ==========================================
        
        // 1. 背景画像の設定
        document.getElementById('input-bg').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const bgUrl = event.target.result;
                document.getElementById('background').style.backgroundImage = `url('${bgUrl}')`;
                // 状態に保存
                appState.pages[appState.currentPageIndex].background = bgUrl;
            };
            reader.readAsDataURL(file);
            e.target.value = ''; // リセット
        });

        // 2. 複数画像の追加
        document.getElementById('input-add').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const imgSrc = event.target.result;
                    addNewImageToState(imgSrc);
                };
                reader.readAsDataURL(file);
            });
            e.target.value = ''; // リセット
        });

        // ==========================================
        // キャンバスへの新規画像追加（状態更新）
        // ==========================================
        function addNewImageToState(src) {
            const id = 'item_' + Date.now() + Math.floor(Math.random() * 1000);
            
            // 初期配置（重ならないように少しずつ右下にずらす）
            const startX = (window.innerWidth / 2 - 100) + placementOffset;
            const startY = (window.innerHeight / 2 - 100) + placementOffset;
            
            // 次の画像のためにずらす量を増やす（150pxを超えたら元に戻す）
            placementOffset += 30;
            if (placementOffset > 150) {
                placementOffset = 0;
            }

            zIndexCounter++;

            // 状態（データ）を保存
            const itemData = {
                id: id,
                src: src,
                x: startX,
                y: startY,
                scale: 1,
                angle: 0,
                zIndex: zIndexCounter
            };
            appState.pages[appState.currentPageIndex].items.push(itemData);

            // 画面に描画
            renderItem(itemData);

            // 描画された要素を取得し、画面幅に合わせて初期サイズを最適化
            const imgEl = document.getElementById(id);
            imgEl.onload = () => {
                const maxW = window.innerWidth * 0.4; // 画面幅の40%を最大値とする
                if (imgEl.naturalWidth > maxW) {
                    const optimalScale = maxW / imgEl.naturalWidth;
                    imgEl.setAttribute('data-scale', optimalScale);
                    itemData.scale = optimalScale;
                    updateTransform(imgEl);
                }
            };
        }

        // ==========================================
        // ジェスチャー操作 (interact.js の設定)
        // ==========================================
        interact('.canvas-item')
            .draggable({
                listeners: {
                    start(event) {
                        bringToFront(event.target);
                    },
                    move(event) {
                        const target = event.target;
                        // 現在のx,yに移動量を足す
                        const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
                        const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
                        
                        target.setAttribute('data-x', x);
                        target.setAttribute('data-y', y);
                        
                        updateTransform(target);
                        updateState(target.id, { x, y });
                    }
                }
            })
            .gesturable({
                listeners: {
                    start(event) {
                        bringToFront(event.target);
                        // ピンチ操作開始時のスケールを記録
                        const target = event.target;
                        target.setAttribute('data-start-scale', target.getAttribute('data-scale') || 1);
                    },
                    move(event) {
                        const target = event.target;
                        
                        // 回転の計算 (event.da は角度の変化量)
                        const currentAngle = parseFloat(target.getAttribute('data-angle')) || 0;
                        const newAngle = currentAngle + event.da;
                        target.setAttribute('data-angle', newAngle);

                        // 拡大縮小の計算 (event.scale は開始時からの相対倍率)
                        const startScale = parseFloat(target.getAttribute('data-start-scale')) || 1;
                        let newScale = startScale * event.scale;
                        
                        // 大きすぎ・小さすぎを防ぐ（10% 〜 500%）
                        newScale = Math.max(0.1, Math.min(newScale, 5.0));
                        target.setAttribute('data-scale', newScale);

                        updateTransform(target);
                        updateState(target.id, { angle: newAngle, scale: newScale });
                    }
                }
            })
            .on('down', function (event) {
                // タッチした瞬間に最前面へ持ってくる
                bringToFront(event.currentTarget);
            });

        // ==========================================
        // ユーティリティ関数
        // ==========================================
        
        // DOMのスタイルを更新
        function updateTransform(target) {
            const x = target.getAttribute('data-x');
            const y = target.getAttribute('data-y');
            const scale = target.getAttribute('data-scale');
            const angle = target.getAttribute('data-angle');
            
            target.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg) scale(${scale})`;
        }

        // タッチした画像を最前面にする
        function bringToFront(target) {
            const currentZ = parseInt(target.style.zIndex, 10) || 0;
            if (currentZ < zIndexCounter) {
                zIndexCounter++;
                target.style.zIndex = zIndexCounter;
                updateState(target.id, { zIndex: zIndexCounter });
            }
        }

        // appState（データ配列）を更新する（将来の保存機能のため）
        function updateState(id, updates) {
            const items = appState.pages[appState.currentPageIndex].items;
            const item = items.find(i => i.id === id);
            if (item) {
                Object.assign(item, updates);
            }
        }
    </script>
</body>
</html>
