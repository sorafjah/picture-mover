<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>画像・テキストキャンバス</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'BIZ UDGothic', 'Hiragino Kaku Gothic ProN', sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #canvas-wrap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .page {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    touch-action: none;
    overflow: hidden;
  }

  .page.active { display: block; }

  .page-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #ddeeff;
    overflow: hidden;
  }

  .page-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    display: none;
  }

  /* 画像とテキストの共通スタイル */
  .img-item, .text-item {
    position: absolute;
    touch-action: none;
    will-change: transform;
    border: 2px solid transparent;
  }

  .img-item img {
    display: block;
    max-width: 300px;
    max-height: 300px;
    width: auto;
    height: auto;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  /* テキスト特有のスタイル */
  .text-item {
    padding: 8px;
    font-size: 32px; /* 基本サイズ。ピンチで拡大縮小されます */
    white-space: pre-wrap; /* 改行を反映 */
    min-width: 1em;
    min-height: 1em;
  }

  /* 選択時のハイライト（画像・テキスト共通） */
  .img-item.selected, .text-item.selected {
    border-color: rgba(60,120,220,0.5);
    box-shadow: 0 0 0 1px rgba(60,120,220,0.2);
    border-radius: 4px;
  }

  /* 歯車ボタン */
  #gear-btn {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2000;
    width: 38px;
    height: 38px;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    opacity: 0.35;
    transition: opacity 0.2s, transform 0.35s ease;
    -webkit-tap-highlight-color: transparent;
  }

  #gear-btn.open {
    opacity: 0.65;
    transform: translateX(-50%) rotate(65deg);
  }

  #gear-btn:active { opacity: 0.8; }

  /* 設定パネル */
  #settings-panel {
    position: fixed;
    bottom: 64px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1900;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(0,0,0,0.07);
    border-radius: 16px;
    padding: 6px 5px;
    display: none;
    flex-direction: column;
    gap: 2px;
    min-width: 160px;
    box-shadow: 0 6px 28px rgba(0,0,0,0.1);
  }

  #settings-panel.open { display: flex; }

  .sp-btn {
    background: none;
    border: none;
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 14px;
    font-family: inherit;
    color: #222;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.12s;
  }

  .sp-btn:active { background: rgba(0,0,0,0.07); }
  .sp-btn.danger { color: #c0392b; }

  .sp-divider {
    height: 1px;
    background: rgba(0,0,0,0.07);
    margin: 2px 4px;
  }

  /* テキスト追加モーダル */
  #text-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 3000;
    display: none;
    align-items: center;
    justify-content: center;
  }

  #text-modal-overlay.open { display: flex; }

  #text-modal {
    background: #fff;
    padding: 20px;
    border-radius: 16px;
    width: 90%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }

  #text-input {
    width: 100%;
    height: 80px;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: none;
    font-family: inherit;
  }

  .tm-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
  }

  .tm-row select, .tm-row input[type="color"] {
    padding: 4px;
    border-radius: 4px;
    border: 1px solid #ccc;
  }

  .tm-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 5px;
  }

  .tm-btn {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #eee;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    -webkit-tap-highlight-color: transparent;
  }

  .tm-btn:active { background: #e0e0e0; }

  .tm-btn-primary {
    background: #3c78dc;
    color: #fff;
  }
  
  .tm-btn-primary:active { background: #2b61b8; }


  /* ページナビ */
  #nav-prev, #nav-next {
    position: fixed;
    bottom: 24px;
    z-index: 1500;
    background: none;
    border: none;
    font-size: 24px;
    color: rgba(0,0,0,0.16);
    padding: 14px 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.15s;
    line-height: 1;
  }

  #nav-prev { left: 2px; }
  #nav-next { right: 2px; }
  #nav-prev:active, #nav-next:active { color: rgba(0,0,0,0.45); }

  #bg-input, #img-input { display: none; }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<!-- 歯車ボタンと設定パネル -->
<button id="gear-btn" onclick="toggleSettings()">⚙️</button>

<div id="settings-panel">
  <button class="sp-btn" onclick="triggerBg()">🌄　背景を設定</button>
  <button class="sp-btn" onclick="triggerImg()">➕　画像を追加</button>
  <button class="sp-btn" onclick="openTextModal()">🔤　テキストを追加</button>
  <div class="sp-divider"></div>
  <button class="sp-btn danger" onclick="deleteSelected()">🗑️　選択を削除</button>
  <div class="sp-divider"></div>
  <button class="sp-btn" onclick="addPage()">📄　ページを追加</button>
</div>

<!-- テキスト追加用モーダル -->
<div id="text-modal-overlay">
  <div id="text-modal">
    <textarea id="text-input" placeholder="テキストを入力"></textarea>
    <div class="tm-row">
      <label>色: <input type="color" id="text-color" value="#000000"></label>
    </div>
    <div class="tm-row">
      <label>フォント:
        <select id="text-font">
          <option value="'BIZ UDGothic', 'Hiragino Kaku Gothic ProN', sans-serif">ゴシック</option>
          <option value="'Hiragino Mincho ProN', 'Yu Mincho', serif">明朝</option>
          <option value="'Hiragino Maru Gothic ProN', sans-serif">丸ゴシック</option>
          <option value="sans-serif">サンセリフ</option>
          <option value="serif">セリフ</option>
        </select>
      </label>
    </div>
    <div class="tm-actions">
      <button class="tm-btn" onclick="closeTextModal()">キャンセル</button>
      <button class="tm-btn tm-btn-primary" onclick="addTextItem()">追加</button>
    </div>
  </div>
</div>

<button id="nav-prev" onclick="goPage(-1)">◁</button>
<button id="nav-next" onclick="goPage(1)">▷</button>

<input type="file" id="bg-input" accept="image/*">
<input type="file" id="img-input" accept="image/*" multiple>

<script>
let pages = [];
let currentPage = 0;
let selectedItem = null;
let zCounter = 10;

const canvasWrap = document.getElementById('canvas-wrap');
const settingsPanel = document.getElementById('settings-panel');
const gearBtn = document.getElementById('gear-btn');

// ========================
// ページ管理
// ========================
function createPageDOM() {
  const page = document.createElement('div');
  page.className = 'page';

  const bg = document.createElement('div');
  bg.className = 'page-bg';

  const bgImg = document.createElement('img');
  bgImg.alt = '背景';
  bg.appendChild(bgImg);
  page.appendChild(bg);

  // 背景タップで選択解除
  page.addEventListener('touchstart', (e) => {
    if (e.target === page || e.target === bg || e.target === bgImg) {
      deselectAll();
    }
  }, { passive: false });

  canvasWrap.appendChild(page);
  return page;
}

function addPage() {
  const dom = createPageDOM();
  pages.push({ dom });
  switchPage(pages.length - 1);
  closeSettings();
}

function switchPage(index) {
  pages.forEach((p, i) => {
    p.dom.classList.toggle('active', i === index);
  });
  currentPage = index;
  deselectAll();
}

function goPage(dir) {
  const next = currentPage + dir;
  if (next < 0 || next >= pages.length) return;
  switchPage(next);
}

addPage(); // 初期ページ

// ========================
// 設定パネル
// ========================
function toggleSettings() {
  const open = settingsPanel.classList.toggle('open');
  gearBtn.classList.toggle('open', open);
}

function closeSettings() {
  settingsPanel.classList.remove('open');
  gearBtn.classList.remove('open');
}

// パネル外タップで閉じる（モーダル表示中は除く）
document.addEventListener('touchstart', (e) => {
  const modalOverlay = document.getElementById('text-modal-overlay');
  if (modalOverlay.classList.contains('open')) return;
  
  if (!settingsPanel.contains(e.target) && e.target !== gearBtn) {
    closeSettings();
  }
}, { passive: true });

// ========================
// 背景・画像追加
// ========================
function triggerBg() {
  document.getElementById('bg-input').click();
  closeSettings();
}

document.getElementById('bg-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const bgImg = pages[currentPage].dom.querySelector('.page-bg img');
  bgImg.src = URL.createObjectURL(file);
  bgImg.style.display = 'block';
  e.target.value = '';
});

function triggerImg() {
  document.getElementById('img-input').click();
  closeSettings();
}

document.getElementById('img-input').addEventListener('change', (e) => {
  Array.from(e.target.files).forEach((file, i) => {
    setTimeout(() => addImageItem(file), i * 50);
  });
  e.target.value = '';
});

function addImageItem(file) {
  const item = document.createElement('div');
  item.className = 'img-item';

  const img = document.createElement('img');
  img.src = URL.createObjectURL(file);

  const state = { x: 100, y: 100, scale: 1, rotate: 0 };
  item._state = state;

  img.onload = () => {
    const page = pages[currentPage].dom;
    const cx = page.clientWidth / 2 + (Math.random() - 0.5) * 50;
    const cy = page.clientHeight / 2 + (Math.random() - 0.5) * 50;
    state.x = cx - Math.min(img.naturalWidth, 300) / 2;
    state.y = cy - Math.min(img.naturalHeight, 300) / 2;
    applyTransform(item, state);
  };

  item.appendChild(img);
  pages[currentPage].dom.appendChild(item);
  attachTouchHandlers(item, state);
  selectItem(item);
}

// ========================
// テキスト追加
// ========================
function openTextModal() {
  document.getElementById('text-modal-overlay').classList.add('open');
  document.getElementById('text-input').value = '';
  closeSettings();
}

function closeTextModal() {
  document.getElementById('text-modal-overlay').classList.remove('open');
}

function addTextItem() {
  const textInput = document.getElementById('text-input').value;
  if (!textInput.trim()) {
    closeTextModal();
    return;
  }
  
  const color = document.getElementById('text-color').value;
  const font = document.getElementById('text-font').value;

  const item = document.createElement('div');
  item.className = 'text-item';
  item.textContent = textInput; // 改行は white-space: pre-wrap で維持されます
  item.style.color = color;
  item.style.fontFamily = font;

  const state = { x: 0, y: 0, scale: 1, rotate: 0 };
  item._state = state;

  const page = pages[currentPage].dom;
  page.appendChild(item);

  // 要素がDOMに追加された直後にサイズを測り、画面中央に配置
  requestAnimationFrame(() => {
    const cx = page.clientWidth / 2;
    const cy = page.clientHeight / 2;
    state.x = cx - (item.offsetWidth / 2) + (Math.random() - 0.5) * 40;
    state.y = cy - (item.offsetHeight / 2) + (Math.random() - 0.5) * 40;
    applyTransform(item, state);
  });

  attachTouchHandlers(item, state);
  selectItem(item);
  closeTextModal();
}

// ========================
// 変換・選択・削除
// ========================
function applyTransform(el, s) {
  el.style.transform = `translate(${s.x}px, ${s.y}px) rotate(${s.rotate}deg) scale(${s.scale})`;
}

function selectItem(item) {
  if (selectedItem && selectedItem !== item) {
    selectedItem.classList.remove('selected');
  }
  selectedItem = item;
  item.classList.add('selected');
  item.style.zIndex = ++zCounter;
}

function deselectAll() {
  if (selectedItem) {
    selectedItem.classList.remove('selected');
    selectedItem = null;
  }
}

function deleteSelected() {
  if (!selectedItem) return;
  selectedItem.parentNode.removeChild(selectedItem);
  selectedItem = null;
  closeSettings();
}

// ========================
// タッチ処理 (画像・テキスト共通)
// ========================
function attachTouchHandlers(el, state) {
  let touches = {};
  let lastDist = null;
  let lastAngle = null;
  let lastMidX = null;
  let lastMidY = null;
  let lastTap = 0;

  el.addEventListener('touchstart', (e) => {
    e.preventDefault();
    e.stopPropagation();
    selectItem(el);

    const now = Date.now();
    if (now - lastTap < 300) { lastTap = 0; return; }
    lastTap = now;

    Array.from(e.changedTouches).forEach(t => {
      touches[t.identifier] = { x: t.clientX, y: t.clientY };
    });

    const ids = Object.keys(touches);
    if (ids.length >= 2) {
      const [a, b] = ids.slice(0, 2).map(id => touches[id]);
      lastDist = vDist(a, b);
      lastAngle = vAngle(a, b);
      lastMidX = (a.x + b.x) / 2;
      lastMidY = (a.y + b.y) / 2;
    }
  }, { passive: false });

  el.addEventListener('touchmove', (e) => {
    e.preventDefault();
    e.stopPropagation();

    const prevPositions = {};
    Object.keys(touches).forEach(id => { prevPositions[id] = { ...touches[id] }; });

    Array.from(e.changedTouches).forEach(t => {
      touches[t.identifier] = { x: t.clientX, y: t.clientY };
    });

    const ids = Object.keys(touches);

    if (ids.length === 1) {
      const id = ids[0];
      const prev = prevPositions[id];
      const cur = touches[id];
      if (prev) {
        state.x += cur.x - prev.x;
        state.y += cur.y - prev.y;
      }
    } else if (ids.length >= 2) {
      const [a, b] = ids.slice(0, 2).map(id => touches[id]);
      const curDist = vDist(a, b);
      const curAngle = vAngle(a, b);
      const curMidX = (a.x + b.x) / 2;
      const curMidY = (a.y + b.y) / 2;

      if (lastDist !== null) {
        state.scale = Math.max(0.1, Math.min(20, state.scale * (curDist / lastDist)));
      }
      if (lastAngle !== null) {
        state.rotate += curAngle - lastAngle;
      }
      if (lastMidX !== null) {
        state.x += curMidX - lastMidX;
        state.y += curMidY - lastMidY;
      }

      lastDist = curDist;
      lastAngle = curAngle;
      lastMidX = curMidX;
      lastMidY = curMidY;
    }

    applyTransform(el, state);
  }, { passive: false });

  el.addEventListener('touchend', (e) => {
    e.preventDefault();
    Array.from(e.changedTouches).forEach(t => { delete touches[t.identifier]; });

    const ids = Object.keys(touches);
    if (ids.length < 2) {
      lastDist = null; lastAngle = null;
      lastMidX = null; lastMidY = null;
    }
  }, { passive: false });
}

function vDist(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }
function vAngle(a, b) { return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI; }

// ダブルタップズーム無効化
document.addEventListener('touchstart', (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

let lastDocTouch = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastDocTouch < 300) e.preventDefault();
  lastDocTouch = now;
}, { passive: false });
</script>
</body>
</html>
