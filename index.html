<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像・テキストキャンバス(PC用)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'BIZ UDGothic', 'Hiragino Kaku Gothic ProN', sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  #canvas-wrap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .page {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    overflow: hidden;
  }

  .page.active { display: block; }

  .page-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #ddeeff;
    overflow: hidden;
  }

  .page-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    display: none;
  }

  /* 画像とテキストの共通スタイル */
  .img-item, .text-item {
    position: absolute;
    cursor: grab;
    will-change: transform;
    /* 枠線を完全に消すために border を削除 */
  }

  .img-item:active, .text-item:active { cursor: grabbing; }

  .img-item img {
    display: block;
    max-width: 300px;
    max-height: 300px;
    width: auto;
    height: auto;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  /* テキスト特有のスタイル */
  .text-item {
    padding: 8px;
    font-size: 32px;
    white-space: pre-wrap; /* 改行を反映 */
    min-width: 1em;
    min-height: 1em;
  }

  /* 選択時のハイライトスタイルを削除（画像・テキスト共に枠線なし） */

  /* 歯車ボタン */
  #gear-btn {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2000;
    width: 38px;
    height: 38px;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    opacity: 0.35;
    transition: opacity 0.2s, transform 0.35s ease;
  }

  #gear-btn.open {
    opacity: 0.65;
    transform: translateX(-50%) rotate(65deg);
  }

  #gear-btn:hover { opacity: 0.6; }

  /* 設定パネル */
  #settings-panel {
    position: fixed;
    bottom: 64px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1900;
    background: rgba(255,255,255,0.93);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(0,0,0,0.07);
    border-radius: 16px;
    padding: 6px 5px;
    display: none;
    flex-direction: column;
    gap: 2px;
    min-width: 170px;
    max-height: 70vh; /* 画面に収まらない場合に備える */
    overflow-y: auto; /* スクロール可能にする */
    box-shadow: 0 6px 28px rgba(0,0,0,0.1);
  }

  #settings-panel.open { display: flex; }

  .sp-btn {
    background: none;
    border: none;
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 14px;
    font-family: inherit;
    color: #222;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    transition: background 0.12s;
  }

  .sp-btn:hover { background: rgba(0,0,0,0.05); }
  .sp-btn:active { background: rgba(0,0,0,0.09); }
  .sp-btn.danger { color: #c0392b; }

  .sp-divider {
    height: 1px;
    background: rgba(0,0,0,0.07);
    margin: 2px 4px;
  }

  /* テキスト追加モーダル */
  #text-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 3000;
    display: none;
    align-items: center;
    justify-content: center;
  }

  #text-modal-overlay.open { display: flex; }

  #text-modal {
    background: #fff;
    padding: 20px;
    border-radius: 16px;
    width: 90%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }

  #text-input {
    width: 100%;
    height: 100px;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
    font-family: inherit;
  }

  .tm-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
  }

  .tm-row select, .tm-row input[type="color"] {
    padding: 4px;
    border-radius: 4px;
    border: 1px solid #ccc;
    cursor: pointer;
  }

  .tm-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 5px;
  }

  .tm-btn {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #eee;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: background 0.1s;
  }

  .tm-btn:hover { background: #e0e0e0; }
  .tm-btn:active { background: #d0d0d0; }

  .tm-btn-primary {
    background: #3c78dc;
    color: #fff;
  }
  
  .tm-btn-primary:hover { background: #3264b8; }
  .tm-btn-primary:active { background: #2b56a0; }


  /* ページナビ */
  #nav-prev, #nav-next {
    position: fixed;
    bottom: 24px;
    z-index: 1500;
    background: none;
    border: none;
    font-size: 24px;
    color: rgba(0,0,0,0.16);
    padding: 14px 14px;
    cursor: pointer;
    transition: color 0.15s;
    line-height: 1;
  }

  #nav-prev { left: 2px; }
  #nav-next { right: 2px; }
  #nav-prev:hover, #nav-next:hover { color: rgba(0,0,0,0.4); }

  #bg-input, #img-input { display: none; }

  /* カーソル：回転モード */
  body.rotate-mode .img-item.selected,
  body.rotate-mode .text-item.selected { cursor: crosshair; }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<button id="gear-btn" onclick="toggleSettings()">⚙️</button>

<div id="settings-panel">
  <button class="sp-btn" onclick="triggerBg()">🌄　背景を設定</button>
  <button class="sp-btn danger" onclick="removeBg()">🚫　背景を削除</button>
  <div class="sp-divider"></div>
  <button class="sp-btn" onclick="triggerImg()">➕　画像を追加</button>
  <button class="sp-btn" onclick="openTextModal()">🔤　テキストを追加</button>
  <button class="sp-btn danger" onclick="deleteSelected()">🗑️　選択を削除</button>
  <div class="sp-divider"></div>
  <button class="sp-btn" onclick="addPage()">📄　ページを追加</button>
  <button class="sp-btn danger" onclick="deletePage()">🗑️　ページを削除</button>
</div>

<!-- テキスト追加用モーダル -->
<div id="text-modal-overlay">
  <div id="text-modal">
    <textarea id="text-input" placeholder="テキストを入力"></textarea>
    <div class="tm-row">
      <label>色: <input type="color" id="text-color" value="#000000"></label>
    </div>
    <div class="tm-row">
      <label>フォント:
        <select id="text-font">
          <optgroup label="UDフォント（読みやすい）">
            <option value="'BIZ UDGothic', sans-serif">BIZ UDゴシック (Win/Mac)</option>
            <option value="'BIZ UDMincho', serif">BIZ UD明朝 (Win/Mac)</option>
            <option value="'UD Digi Kyokasho N-R', 'UD デジタル 教科書体 N-R', sans-serif">UDデジタル教科書体 (Win)</option>
          </optgroup>
          <optgroup label="標準・汎用">
            <option value="sans-serif">ゴシック体（標準）</option>
            <option value="serif">明朝体（標準）</option>
            <option value="monospace">等幅フォント</option>
            <option value="cursive">手書き風・筆記体</option>
            <option value="fantasy">装飾フォント</option>
          </optgroup>
          <optgroup label="日本語（Windows/Mac共通）">
            <option value="'Yu Gothic', '游ゴシック', sans-serif">游ゴシック</option>
            <option value="'Yu Mincho', '游明朝', serif">游明朝</option>
          </optgroup>
          <optgroup label="日本語（Mac/iOS系）">
            <option value="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">ヒラギノ角ゴ</option>
            <option value="'Hiragino Mincho ProN', serif">ヒラギノ明朝</option>
            <option value="'Hiragino Maru Gothic ProN', sans-serif">ヒラギノ丸ゴ</option>
            <option value="'Klee', 'Klee One', cursive">クレー（手書き風）</option>
          </optgroup>
          <optgroup label="日本語（Windows系）">
            <option value="'Meiryo', 'メイリオ', sans-serif">メイリオ</option>
            <option value="'MS PGothic', 'ＭＳ Ｐゴシック', sans-serif">ＭＳ Ｐゴシック</option>
            <option value="'MS PMincho', 'ＭＳ Ｐ明朝', serif">ＭＳ Ｐ明朝</option>
          </optgroup>
          <optgroup label="欧文">
            <option value="Arial, sans-serif">Arial</option>
            <option value="'Helvetica Neue', Helvetica, sans-serif">Helvetica</option>
            <option value="'Times New Roman', Times, serif">Times New Roman</option>
            <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
            <option value="Impact, fantasy">Impact</option>
          </optgroup>
        </select>
      </label>
    </div>
    <div class="tm-actions">
      <button class="tm-btn" onclick="closeTextModal()">キャンセル</button>
      <button class="tm-btn tm-btn-primary" onclick="addTextItem()">追加</button>
    </div>
  </div>
</div>

<button id="nav-prev" onclick="goPage(-1)">◁</button>
<button id="nav-next" onclick="goPage(1)">▷</button>

<input type="file" id="bg-input" accept="image/*">
<input type="file" id="img-input" accept="image/*" multiple>

<script>
let pages = [];
let currentPage = 0;
let selectedItem = null;
let zCounter = 10;

const canvasWrap = document.getElementById('canvas-wrap');
const settingsPanel = document.getElementById('settings-panel');
const gearBtn = document.getElementById('gear-btn');

// ========================
// ページ管理
// ========================
function createPageDOM() {
  const page = document.createElement('div');
  page.className = 'page';

  const bg = document.createElement('div');
  bg.className = 'page-bg';

  const bgImg = document.createElement('img');
  bgImg.alt = '背景';
  bg.appendChild(bgImg);
  page.appendChild(bg);

  // 背景クリック・タッチで選択解除
  const deselectFn = (e) => {
    if (e.target === page || e.target === bg || e.target === bgImg) {
      deselectAll();
      closeSettings();
    }
  };
  page.addEventListener('mousedown', deselectFn);
  page.addEventListener('touchstart', deselectFn, { passive: true });

  canvasWrap.appendChild(page);
  return page;
}

function addPage() {
  const dom = createPageDOM();
  pages.push({ dom });
  switchPage(pages.length - 1);
  closeSettings();
}

function switchPage(index) {
  pages.forEach((p, i) => {
    p.dom.classList.toggle('active', i === index);
  });
  currentPage = index;
  deselectAll();
}

function goPage(dir) {
  const next = currentPage + dir;
  if (next < 0 || next >= pages.length) return;
  switchPage(next);
}

function deletePage() {
  if (pages.length === 1) {
    // 最後の1ページの場合は白紙にリセット
    const page = pages[0].dom;
    const bgImg = page.querySelector('.page-bg img');
    bgImg.src = '';
    bgImg.style.display = 'none';
    const items = page.querySelectorAll('.img-item, .text-item');
    items.forEach(item => item.parentNode.removeChild(item));
    selectedItem = null;
    closeSettings();
    return;
  }

  // 現在のページをDOMから削除
  const pageToRemove = pages[currentPage];
  pageToRemove.dom.parentNode.removeChild(pageToRemove.dom);
  
  // 配列から削除
  pages.splice(currentPage, 1);
  
  // ページインデックス調整
  if (currentPage >= pages.length) {
    currentPage = pages.length - 1;
  }
  
  switchPage(currentPage);
  closeSettings();
}

addPage(); // 初期ページ

// ========================
// 設定パネル
// ========================
function toggleSettings() {
  const open = settingsPanel.classList.toggle('open');
  gearBtn.classList.toggle('open', open);
}

function closeSettings() {
  settingsPanel.classList.remove('open');
  gearBtn.classList.remove('open');
}

// モーダル表示中はパネル外クリックで閉じないようにする（PC/iPad両対応）
const closeSettingsFn = (e) => {
  const modalOverlay = document.getElementById('text-modal-overlay');
  if (modalOverlay.classList.contains('open')) return;

  if (!settingsPanel.contains(e.target) && e.target !== gearBtn) {
    closeSettings();
  }
};
document.addEventListener('mousedown', closeSettingsFn);
document.addEventListener('touchstart', closeSettingsFn, { passive: true });

// ========================
// 背景
// ========================
function triggerBg() {
  document.getElementById('bg-input').click();
  closeSettings();
}

document.getElementById('bg-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const bgImg = pages[currentPage].dom.querySelector('.page-bg img');
  bgImg.src = URL.createObjectURL(file);
  bgImg.style.display = 'block';
  e.target.value = '';
});

function removeBg() {
  const bgImg = pages[currentPage].dom.querySelector('.page-bg img');
  bgImg.src = '';
  bgImg.style.display = 'none';
  closeSettings();
}

// ========================
// 画像追加
// ========================
function triggerImg() {
  document.getElementById('img-input').click();
  closeSettings();
}

document.getElementById('img-input').addEventListener('change', (e) => {
  Array.from(e.target.files).forEach((file, i) => {
    setTimeout(() => addImageItem(file), i * 50);
  });
  e.target.value = '';
});

function addImageItem(file) {
  const item = document.createElement('div');
  item.className = 'img-item';

  const img = document.createElement('img');
  img.src = URL.createObjectURL(file);

  const state = { x: 100, y: 100, scale: 1, rotate: 0 };
  item._state = state;

  img.onload = () => {
    const page = pages[currentPage].dom;
    const cx = page.clientWidth / 2 + (Math.random() - 0.5) * 100;
    const cy = page.clientHeight / 2 + (Math.random() - 0.5) * 100;
    state.x = cx - Math.min(img.naturalWidth, 300) / 2;
    state.y = cy - Math.min(img.naturalHeight, 300) / 2;
    applyTransform(item, state);
  };

  item.appendChild(img);
  pages[currentPage].dom.appendChild(item);
  
  // PC用・iPad用両方の操作を登録
  attachMouseHandlers(item, state);
  attachTouchHandlers(item, state);
  
  selectItem(item);
}

// ========================
// テキスト追加
// ========================
function openTextModal() {
  document.getElementById('text-modal-overlay').classList.add('open');
  document.getElementById('text-input').value = '';
  // PC版なので表示時にフォーカスを当てる
  setTimeout(() => document.getElementById('text-input').focus(), 50);
  closeSettings();
}

function closeTextModal() {
  document.getElementById('text-modal-overlay').classList.remove('open');
}

function addTextItem() {
  const textInput = document.getElementById('text-input').value;
  if (!textInput.trim()) {
    closeTextModal();
    return;
  }
  
  const color = document.getElementById('text-color').value;
  const font = document.getElementById('text-font').value;

  const item = document.createElement('div');
  item.className = 'text-item';
  item.textContent = textInput;
  item.style.color = color;
  item.style.fontFamily = font;

  const state = { x: 0, y: 0, scale: 1, rotate: 0 };
  item._state = state;

  const page = pages[currentPage].dom;
  page.appendChild(item);

  // 要素がDOMに追加された直後にサイズを測り配置
  requestAnimationFrame(() => {
    const cx = page.clientWidth / 2;
    const cy = page.clientHeight / 2;
    state.x = cx - (item.offsetWidth / 2) + (Math.random() - 0.5) * 40;
    state.y = cy - (item.offsetHeight / 2) + (Math.random() - 0.5) * 40;
    applyTransform(item, state);
  });

  // PC用・iPad用両方の操作を登録
  attachMouseHandlers(item, state);
  attachTouchHandlers(item, state);

  selectItem(item);
  closeTextModal();
}

// ========================
// 変換
// ========================
function applyTransform(el, s) {
  el.style.transform = `translate(${s.x}px, ${s.y}px) rotate(${s.rotate}deg) scale(${s.scale})`;
}

// ========================
// 選択・削除
// ========================
function selectItem(item) {
  if (selectedItem && selectedItem !== item) {
    selectedItem.classList.remove('selected');
  }
  selectedItem = item;
  item.classList.add('selected');
  item.style.zIndex = ++zCounter;
}

function deselectAll() {
  if (selectedItem) {
    selectedItem.classList.remove('selected');
    selectedItem = null;
  }
}

function deleteSelected() {
  if (!selectedItem) return;
  selectedItem.parentNode.removeChild(selectedItem);
  selectedItem = null;
  closeSettings();
}

// ========================
// マウス操作 (画像・テキスト共通)
// ========================
function attachMouseHandlers(el, state) {
  el.addEventListener('mousedown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    selectItem(el);

    const startX = e.clientX;
    const startY = e.clientY;
    const startStateX = state.x;
    const startStateY = state.y;
    const startRotate = state.rotate;

    // アイテム中心座標（画面上）
    const rect = el.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const isRotate = e.shiftKey || e.button === 2;

    // 回転モード：マウスダウン時の角度を基準に
    const startAngle = isRotate
      ? Math.atan2(startY - centerY, startX - centerX) * 180 / Math.PI
      : 0;

    const onMove = (me) => {
      if (isRotate) {
        // 中心からの角度差で回転
        const curAngle = Math.atan2(me.clientY - centerY, me.clientX - centerX) * 180 / Math.PI;
        state.rotate = startRotate + (curAngle - startAngle);
      } else {
        state.x = startStateX + (me.clientX - startX);
        state.y = startStateY + (me.clientY - startY);
      }
      applyTransform(el, state);
    };

    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // 右クリックメニュー抑制
  el.addEventListener('contextmenu', (e) => e.preventDefault());

  // ホイールで拡大縮小
  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    e.stopPropagation();
    selectItem(el);
    const delta = e.deltaY > 0 ? 0.92 : 1.09;
    state.scale = Math.max(0.05, Math.min(20, state.scale * delta));
    applyTransform(el, state);
  }, { passive: false });
}

// ========================
// タッチ操作 (iPad・スマホ用)
// ========================
function attachTouchHandlers(el, state) {
  let touches = {};
  let lastDist = null;
  let lastAngle = null;
  let lastMidX = null;
  let lastMidY = null;
  let lastTap = 0;

  el.addEventListener('touchstart', (e) => {
    e.preventDefault();
    e.stopPropagation();
    selectItem(el);

    const now = Date.now();
    if (now - lastTap < 300) { lastTap = 0; return; }
    lastTap = now;

    Array.from(e.changedTouches).forEach(t => {
      touches[t.identifier] = { x: t.clientX, y: t.clientY };
    });

    const ids = Object.keys(touches);
    if (ids.length >= 2) {
      const [a, b] = ids.slice(0, 2).map(id => touches[id]);
      lastDist = vDist(a, b);
      lastAngle = vAngle(a, b);
      lastMidX = (a.x + b.x) / 2;
      lastMidY = (a.y + b.y) / 2;
    }
  }, { passive: false });

  el.addEventListener('touchmove', (e) => {
    e.preventDefault();
    e.stopPropagation();

    const prevPositions = {};
    Object.keys(touches).forEach(id => { prevPositions[id] = { ...touches[id] }; });

    Array.from(e.changedTouches).forEach(t => {
      touches[t.identifier] = { x: t.clientX, y: t.clientY };
    });

    const ids = Object.keys(touches);

    if (ids.length === 1) {
      const id = ids[0];
      const prev = prevPositions[id];
      const cur = touches[id];
      if (prev) {
        state.x += cur.x - prev.x;
        state.y += cur.y - prev.y;
      }
    } else if (ids.length >= 2) {
      const [a, b] = ids.slice(0, 2).map(id => touches[id]);
      const curDist = vDist(a, b);
      const curAngle = vAngle(a, b);
      const curMidX = (a.x + b.x) / 2;
      const curMidY = (a.y + b.y) / 2;

      if (lastDist !== null) {
        state.scale = Math.max(0.05, Math.min(20, state.scale * (curDist / lastDist)));
      }
      if (lastAngle !== null) {
        state.rotate += curAngle - lastAngle;
      }
      if (lastMidX !== null) {
        state.x += curMidX - lastMidX;
        state.y += curMidY - lastMidY;
      }

      lastDist = curDist;
      lastAngle = curAngle;
      lastMidX = curMidX;
      lastMidY = curMidY;
    }

    applyTransform(el, state);
  }, { passive: false });

  el.addEventListener('touchend', (e) => {
    e.preventDefault();
    Array.from(e.changedTouches).forEach(t => { delete touches[t.identifier]; });

    const ids = Object.keys(touches);
    if (ids.length < 2) {
      lastDist = null; lastAngle = null;
      lastMidX = null; lastMidY = null;
    }
  }, { passive: false });
}

function vDist(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }
function vAngle(a, b) { return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI; }

// 誤作動防止（ダブルタップズーム無効化など）
document.addEventListener('touchstart', (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

let lastDocTouch = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastDocTouch < 300) e.preventDefault();
  lastDocTouch = now;
}, { passive: false });


// キーボードショートカット
document.addEventListener('keydown', (e) => {
  // Delete / Backspace で選択削除
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedItem) {
    // input や textarea にフォーカスがある場合は削除を発動させない
    const activeTag = document.activeElement.tagName;
    if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;
    deleteSelected();
  }

  // 矢印キーで微調整移動
  if (selectedItem && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
    const s = selectedItem._state;
    const step = e.shiftKey ? 10 : 1;
    if (e.key === 'ArrowLeft')  s.x -= step;
    if (e.key === 'ArrowRight') s.x += step;
    if (e.key === 'ArrowUp')    s.y -= step;
    if (e.key === 'ArrowDown')  s.y += step;
    applyTransform(selectedItem, s);
    e.preventDefault();
  }

  // [ / ] で回転
  if (selectedItem && (e.key === '[' || e.key === ']')) {
    const s = selectedItem._state;
    const step = e.shiftKey ? 15 : 5;
    s.rotate += e.key === ']' ? step : -step;
    applyTransform(selectedItem, s);
    e.preventDefault();
  }
});
</script>
</body>
</html>
