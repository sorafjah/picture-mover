<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>画像操作アプリ</title>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #e0e0e0;
            touch-action: none; -webkit-touch-callout: none;
            -webkit-user-select: none; user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: contain; background-position: center;
            background-repeat: no-repeat; z-index: 0; pointer-events: none;
        }
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }
        .canvas-item {
            position: absolute; top: 0; left: 0; transform-origin: center center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); border-radius: 8px;
        }
        .nav-btn {
            position: absolute; bottom: 20px; font-size: 40px;
            color: rgba(0,0,0,0.4); background: transparent;
            width: 50px; height: 50px; display: flex;
            justify-content: center; align-items: center;
            z-index: 9999; cursor: pointer; touch-action: manipulation; user-select: none;
        }
        .nav-btn:active { color: rgba(0,0,0,0.8); }
        .nav-btn.left { left: 20px; }
        .nav-btn.right { right: 20px; }
        .nav-btn.disabled { opacity: 0.1; pointer-events: none; }
        .settings-btn {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            font-size: 40px; color: #000; opacity: 0.15;
            z-index: 9999; cursor: pointer; touch-action: manipulation; user-select: none;
        }
        .settings-btn:active { opacity: 0.4; }
        #settings-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 10000;
            justify-content: center; align-items: center; backdrop-filter: blur(2px);
        }
        .modal-content {
            background: rgba(255,255,255,0.95); padding: 30px; border-radius: 20px;
            display: flex; flex-direction: column; gap: 20px; min-width: 280px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-content button {
            padding: 16px; font-size: 18px; font-weight: bold; color: #fff;
            background-color: #007aff; border: none; border-radius: 12px;
            cursor: pointer; touch-action: manipulation;
        }
        .modal-content button:active { background-color: #005bb5; }
        .modal-content button.close-btn { background-color: #8e8e93; }
        .modal-content button.close-btn:active { background-color: #636366; }
        .hidden-input { display: none; }
    </style>
</head>
<body>
    <div id="btn-prev" class="nav-btn left disabled">◁</div>
    <div id="btn-settings" class="settings-btn">⚙</div>
    <div id="btn-next" class="nav-btn right disabled">▷</div>

    <div id="settings-modal">
        <div class="modal-content">
            <button id="btn-bg">背景を変更</button>
            <button id="btn-add">画像を追加</button>
            <button id="btn-add-page">新しいページを追加</button>
            <button id="btn-close-modal" class="close-btn">閉じる</button>
        </div>
    </div>

    <input type="file" id="input-bg" class="hidden-input" accept="image/*">
    <input type="file" id="input-add" class="hidden-input" accept="image/*" multiple>
    <div id="background"></div>
    <div id="canvas-container"></div>

    <script>
        const appState = {
            pages: [{ id: 'page-1', background: null, items: [] }],
            currentPageIndex: 0
        };

        let zIndexCounter = 10;
        let placementOffset = 0;

        const modal = document.getElementById('settings-modal');

        document.getElementById('btn-settings').addEventListener('click', () => { modal.style.display = 'flex'; });
        document.getElementById('btn-close-modal').addEventListener('click', () => { modal.style.display = 'none'; });
        document.getElementById('btn-bg').addEventListener('click', () => {
            document.getElementById('input-bg').click();
            modal.style.display = 'none';
        });
        document.getElementById('btn-add').addEventListener('click', () => {
            document.getElementById('input-add').click();
            modal.style.display = 'none';
        });
        document.getElementById('btn-add-page').addEventListener('click', () => {
            appState.pages.push({ id: 'page-' + (appState.pages.length + 1), background: null, items: [] });
            appState.currentPageIndex = appState.pages.length - 1;
            renderPage();
            modal.style.display = 'none';
        });
        document.getElementById('btn-prev').addEventListener('click', () => {
            if (appState.currentPageIndex > 0) { appState.currentPageIndex--; renderPage(); }
        });
        document.getElementById('btn-next').addEventListener('click', () => {
            if (appState.currentPageIndex < appState.pages.length - 1) { appState.currentPageIndex++; renderPage(); }
        });

        function renderPage() {
            const page = appState.pages[appState.currentPageIndex];
            document.getElementById('background').style.backgroundImage =
                page.background ? `url('${page.background}')` : 'none';
            document.getElementById('canvas-container').innerHTML = '';
            page.items.forEach(itemData => renderItem(itemData));
            document.getElementById('btn-prev').classList.toggle('disabled', appState.currentPageIndex === 0);
            document.getElementById('btn-next').classList.toggle('disabled', appState.currentPageIndex >= appState.pages.length - 1);
        }

        function renderItem(itemData) {
            const imgEl = document.createElement('img');
            imgEl.className = 'canvas-item';
            imgEl.id = itemData.id;
            imgEl.style.zIndex = itemData.zIndex;
            imgEl.setAttribute('data-x', itemData.x);
            imgEl.setAttribute('data-y', itemData.y);
            imgEl.setAttribute('data-scale', itemData.scale);
            imgEl.setAttribute('data-angle', itemData.angle);
            updateTransform(imgEl);
            document.getElementById('canvas-container').appendChild(imgEl);
            imgEl.src = itemData.src;
        }

        document.getElementById('input-bg').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const bgUrl = event.target.result;
                document.getElementById('background').style.backgroundImage = `url('${bgUrl}')`;
                appState.pages[appState.currentPageIndex].background = bgUrl;
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        // 複数ファイルを順番に処理（インデックスを使って offset を確定させる）
        document.getElementById('input-add').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            // 各ファイルに offset を事前割り当てしてからまとめて読み込む
            files.forEach((file, i) => {
                const myOffset = placementOffset;
                placementOffset += 30;
                if (placementOffset > 100) placementOffset = -50;

                const reader = new FileReader();
                reader.onload = (event) => {
                    addNewImageToState(event.target.result, myOffset);
                };
                reader.readAsDataURL(file);
            });
            e.target.value = '';
        });

        // offset を引数で受け取る（非同期タイミングに依存しない）
        function addNewImageToState(src, offset) {
            const id = 'item_' + Date.now() + Math.floor(Math.random() * 1000);
            zIndexCounter++;

            const itemData = { id, src, x: 0, y: 0, scale: 1, angle: 0, zIndex: zIndexCounter };
            appState.pages[appState.currentPageIndex].items.push(itemData);

            // DOM 要素を作り、onload を先に登録してから src をセット
            const imgEl = document.createElement('img');
            imgEl.className = 'canvas-item';
            imgEl.id = id;
            imgEl.style.zIndex = zIndexCounter;
            imgEl.style.opacity = '0';
            imgEl.setAttribute('data-x', 0);
            imgEl.setAttribute('data-y', 0);
            imgEl.setAttribute('data-scale', 1);
            imgEl.setAttribute('data-angle', 0);
            updateTransform(imgEl);
            document.getElementById('canvas-container').appendChild(imgEl);

            // addEventListener で先に登録してから src をセット（Base64でも確実に発火）
            imgEl.addEventListener('load', () => {
                const maxW = window.innerWidth * 0.4;
                const maxH = window.innerHeight * 0.4;
                let optimalScale = 1;
                if (imgEl.naturalWidth > maxW || imgEl.naturalHeight > maxH) {
                    const scaleW = maxW / imgEl.naturalWidth;
                    const scaleH = maxH / imgEl.naturalHeight;
                    optimalScale = Math.min(scaleW, scaleH);
                }
                const displayWidth  = imgEl.naturalWidth  * optimalScale;
                const displayHeight = imgEl.naturalHeight * optimalScale;

                const startX = (window.innerWidth  / 2) - (displayWidth  / 2) + offset;
                const startY = (window.innerHeight / 2) - (displayHeight / 2) + offset;

                imgEl.setAttribute('data-x', startX);
                imgEl.setAttribute('data-y', startY);
                imgEl.setAttribute('data-scale', optimalScale);
                itemData.x = startX;
                itemData.y = startY;
                itemData.scale = optimalScale;

                updateTransform(imgEl);
                imgEl.style.opacity = '1';
            });

            imgEl.src = src;
        }

        interact('.canvas-item')
            .draggable({
                listeners: {
                    start(event) { bringToFront(event.target); },
                    move(event) {
                        const target = event.target;
                        const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
                        const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
                        target.setAttribute('data-x', x);
                        target.setAttribute('data-y', y);
                        updateTransform(target);
                        updateState(target.id, { x, y });
                    }
                }
            })
            .gesturable({
                listeners: {
                    start(event) {
                        bringToFront(event.target);
                        event.target.setAttribute('data-start-scale', event.target.getAttribute('data-scale') || 1);
                    },
                    move(event) {
                        const target = event.target;
                        const newAngle = (parseFloat(target.getAttribute('data-angle')) || 0) + event.da;
                        target.setAttribute('data-angle', newAngle);
                        let newScale = (parseFloat(target.getAttribute('data-start-scale')) || 1) * event.scale;
                        newScale = Math.max(0.1, Math.min(newScale, 5.0));
                        target.setAttribute('data-scale', newScale);
                        updateTransform(target);
                        updateState(target.id, { angle: newAngle, scale: newScale });
                    }
                }
            })
            .on('down', function(event) { bringToFront(event.currentTarget); });

        function updateTransform(target) {
            const x = target.getAttribute('data-x');
            const y = target.getAttribute('data-y');
            const scale = target.getAttribute('data-scale');
            const angle = target.getAttribute('data-angle');
            target.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg) scale(${scale})`;
        }

        function bringToFront(target) {
            if (parseInt(target.style.zIndex, 10) < zIndexCounter) {
                zIndexCounter++;
                target.style.zIndex = zIndexCounter;
                updateState(target.id, { zIndex: zIndexCounter });
            }
        }

        function updateState(id, updates) {
            const items = appState.pages[appState.currentPageIndex].items;
            const item = items.find(i => i.id === id);
            if (item) Object.assign(item, updates);
        }
    </script>
</body>
</html>
