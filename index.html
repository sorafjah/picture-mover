<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>画像キャンバス</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #1a1a1a;
    font-family: 'BIZ UDGothic', 'Hiragino Kaku Gothic ProN', sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* キャンバスエリア */
  #canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    overflow: hidden;
  }

  /* 背景画像 */
  #bg-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    display: none;
  }

  /* 貼り付け画像 */
  .img-item {
    position: absolute;
    cursor: pointer;
    touch-action: none;
    transform-origin: center center;
    will-change: transform;
  }

  .img-item img {
    display: block;
    max-width: 300px;
    max-height: 300px;
    width: auto;
    height: auto;
    pointer-events: none;
    -webkit-user-drag: none;
    border: 2px solid transparent;
    transition: border-color 0.15s;
  }

  .img-item.selected img {
    border-color: rgba(255,255,255,0.6);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.3);
  }

  /* UIツールバー */
  #toolbar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(30,30,30,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 10px 16px;
    z-index: 1000;
  }

  .tb-btn {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .tb-btn:active {
    background: rgba(255,255,255,0.25);
  }

  .tb-divider {
    width: 1px;
    height: 28px;
    background: rgba(255,255,255,0.15);
  }

  .tb-btn.danger {
    border-color: rgba(255,80,80,0.3);
    color: #ff8080;
  }

  .tb-btn.danger:active {
    background: rgba(255,80,80,0.2);
  }

  /* ファイル入力（非表示） */
  #bg-input, #img-input {
    display: none;
  }

  /* 背景なしのプレースホルダー */
  #placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: rgba(255,255,255,0.2);
    font-size: 15px;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  #placeholder .icon {
    font-size: 48px;
    opacity: 0.3;
  }
</style>
</head>
<body>

<div id="canvas">
  <img id="bg-image" alt="背景">
  <div id="placeholder">
    <div class="icon">🖼️</div>
    <div>下のボタンから背景・画像を追加できます</div>
  </div>
</div>

<div id="toolbar">
  <button class="tb-btn" onclick="document.getElementById('bg-input').click()">🌄 背景</button>
  <div class="tb-divider"></div>
  <button class="tb-btn" onclick="document.getElementById('img-input').click()">➕ 画像</button>
  <div class="tb-divider"></div>
  <button class="tb-btn danger" id="delete-btn" onclick="deleteSelected()" style="display:none">🗑️ 削除</button>
</div>

<input type="file" id="bg-input" accept="image/*">
<input type="file" id="img-input" accept="image/*" multiple>

<script>
// ========================
// 状態管理
// ========================
let selectedItem = null;
const canvas = document.getElementById('canvas');
const bgImage = document.getElementById('bg-image');
const placeholder = document.getElementById('placeholder');
const deleteBtn = document.getElementById('delete-btn');

// ========================
// 背景画像
// ========================
document.getElementById('bg-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  bgImage.src = url;
  bgImage.style.display = 'block';
  placeholder.style.opacity = '0';
  e.target.value = '';
});

// ========================
// 画像追加
// ========================
document.getElementById('img-input').addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  files.forEach((file, i) => {
    setTimeout(() => addImageItem(file), i * 50);
  });
  e.target.value = '';
});

function addImageItem(file) {
  const url = URL.createObjectURL(file);
  const item = document.createElement('div');
  item.className = 'img-item';

  const img = document.createElement('img');
  img.src = url;
  img.onload = () => {
    // 中央付近にランダム配置
    const cx = canvas.clientWidth / 2 + (Math.random() - 0.5) * 120;
    const cy = canvas.clientHeight / 2 + (Math.random() - 0.5) * 120;
    state.x = cx - img.naturalWidth * 0.15;
    state.y = cy - img.naturalHeight * 0.15;
    applyTransform(item, state);
  };

  item.appendChild(img);
  canvas.appendChild(item);

  // 各アイテムの変換状態
  const state = { x: 100, y: 100, scale: 1, rotate: 0 };
  item._state = state;

  attachTouchHandlers(item, state);
  selectItem(item);
}

// ========================
// 変換適用
// ========================
function applyTransform(el, s) {
  el.style.transform = `translate(${s.x}px, ${s.y}px) rotate(${s.rotate}deg) scale(${s.scale})`;
}

// ========================
// 選択
// ========================
function selectItem(item) {
  if (selectedItem && selectedItem !== item) {
    selectedItem.classList.remove('selected');
  }
  selectedItem = item;
  item.classList.add('selected');
  item.style.zIndex = getNextZ();
  deleteBtn.style.display = '';
}

function deselectAll() {
  if (selectedItem) {
    selectedItem.classList.remove('selected');
    selectedItem = null;
  }
  deleteBtn.style.display = 'none';
}

let zCounter = 10;
function getNextZ() {
  return ++zCounter;
}

// キャンバス背景タップで選択解除
canvas.addEventListener('touchstart', (e) => {
  if (e.target === canvas || e.target === bgImage) {
    deselectAll();
  }
}, { passive: false });

// ========================
// 削除
// ========================
function deleteSelected() {
  if (!selectedItem) return;
  canvas.removeChild(selectedItem);
  selectedItem = null;
  deleteBtn.style.display = 'none';
}

// ========================
// タッチ処理（移動・ピンチ・回転）
// ========================
function attachTouchHandlers(el, state) {
  let touches = {};       // 現在のタッチ情報
  let lastDist = null;    // ピンチ距離
  let lastAngle = null;   // 回転角度
  let lastMidX = null;    // 中点X
  let lastMidY = null;    // 中点Y
  let lastTap = 0;        // ダブルタップ検出用

  el.addEventListener('touchstart', (e) => {
    e.preventDefault();
    e.stopPropagation();
    selectItem(el);
    el.style.zIndex = getNextZ();

    // ダブルタップ無効化
    const now = Date.now();
    if (now - lastTap < 300) {
      lastTap = 0;
      return;
    }
    lastTap = now;

    Array.from(e.changedTouches).forEach(t => {
      touches[t.identifier] = { x: t.clientX, y: t.clientY };
    });

    const ids = Object.keys(touches);
    if (ids.length === 2) {
      const [a, b] = ids.map(id => touches[id]);
      lastDist = dist(a, b);
      lastAngle = angle(a, b);
      lastMidX = (a.x + b.x) / 2;
      lastMidY = (a.y + b.y) / 2;
    }
  }, { passive: false });

  el.addEventListener('touchmove', (e) => {
    e.preventDefault();
    e.stopPropagation();

    Array.from(e.changedTouches).forEach(t => {
      touches[t.identifier] = { x: t.clientX, y: t.clientY };
    });

    const ids = Object.keys(touches);

    if (ids.length === 1) {
      // 1本指：移動
      const t = e.changedTouches[0];
      const prev = touches[t.identifier];
      // changedTouchesの前回値と比較するため直前の値を保持
      const prevPos = el._prevTouch;
      if (prevPos) {
        const dx = t.clientX - prevPos.x;
        const dy = t.clientY - prevPos.y;
        state.x += dx;
        state.y += dy;
      }
      el._prevTouch = { x: t.clientX, y: t.clientY };
    } else if (ids.length === 2) {
      // 2本指：ピンチ＋回転
      const [a, b] = ids.map(id => touches[id]);
      const curDist = dist(a, b);
      const curAngle = angle(a, b);
      const curMidX = (a.x + b.x) / 2;
      const curMidY = (a.y + b.y) / 2;

      if (lastDist !== null) {
        const scaleDelta = curDist / lastDist;
        state.scale = Math.max(0.1, Math.min(10, state.scale * scaleDelta));
      }
      if (lastAngle !== null) {
        const angleDelta = curAngle - lastAngle;
        state.rotate += angleDelta;
      }
      if (lastMidX !== null) {
        state.x += curMidX - lastMidX;
        state.y += curMidY - lastMidY;
      }

      lastDist = curDist;
      lastAngle = curAngle;
      lastMidX = curMidX;
      lastMidY = curMidY;
    }

    applyTransform(el, state);
  }, { passive: false });

  el.addEventListener('touchend', (e) => {
    e.preventDefault();
    Array.from(e.changedTouches).forEach(t => {
      delete touches[t.identifier];
    });
    el._prevTouch = null;

    const ids = Object.keys(touches);
    if (ids.length < 2) {
      lastDist = null;
      lastAngle = null;
      lastMidX = null;
      lastMidY = null;
    }
    if (ids.length === 1) {
      const id = ids[0];
      el._prevTouch = { x: touches[id].x, y: touches[id].y };
    }
  }, { passive: false });
}

// ========================
// ユーティリティ
// ========================
function dist(a, b) {
  return Math.hypot(b.x - a.x, b.y - a.y);
}

function angle(a, b) {
  return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
}

// ブラウザのダブルタップズーム完全無効化
document.addEventListener('touchstart', (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

let lastTouch = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouch < 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });
</script>
</body>
</html>
